server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same purpose as the Vite dev-server proxy in vite.config.ts:
    # the browser only ever talks to this origin. nginx forwards
    # REST calls to the backend service server-side, so the app never
    # needs a cross-origin URL or CORS in production either.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO needs the Upgrade/Connection headers forwarded for the
    # WebSocket handshake, plus a long read timeout for long-lived
    # connections (nginx defaults to 60s and will otherwise kill idle
    # sockets between ticks).
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend:4000/health;
    }

    # Long-cache hashed build assets; never cache index.html itself so
    # a new deploy is always picked up on next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
